<title id="title">Saleae Test Automation workflow</title>
<desc id="description">Extend the Saleae workflow with scheduled recording windows and duration-controlled capture so a marine control and monitoring module can be observed through a PC during performance testing. Flow: Plan test windows; Acquire via API; Analyze transitions; Retain test evidence</desc>
